</style><rect width="860" height="388" rx="8" fill="#0d1117" stroke="#30363d"/><line x1="176" y1="41" x2="176" y2="312" stroke="#30363d" stroke-width="2"/><circle cx="176" cy="41" r="6" fill="#39d353" stroke="#39d353" stroke-width="2"/><circle cx="176" cy="168" r="6" fill="#0d1117" stroke="#8b949e" stroke-width="2"/><circle cx="176" cy="312" r="6" fill="#0d1117" stroke="#8b949e" stroke-width="2"/><g class="a" style="animation-delay:0ms"><text class="m" x="152" y="45" text-anchor="end" font-size="12">Dec 2025</text><text class="h" x="204" y="45">M.Sc. Computer Science, with honors<tspan class="d" font-weight="400" font-size="14"> University of Cologne</tspan></text><circle cx="207" cy="66" r="2" fill="#8b949e"/><text class="b" x="220" y="70">Software-Intensive Systems and High-Performance Computing</text><circle cx="207" cy="91" r="2" fill="#8b949e"/><text class="b" x="220" y="95">Master thesis at the German Aerospace Center (DLR), Distributed Software Systems group</text><circle cx="207" cy="116" r="2" fill="#8b949e"/><text class="b" x="220" y="120">Member of the faculty selection committee</text></g><g class="a" style="animation-delay:180ms"><text class="m" x="152" y="172" text-anchor="end" font-size="12">2022</text><text class="h" x="204" y="172">B.Sc. Computer Science<tspan class="d" font-weight="400" font-size="14"> RWTH Aachen University</tspan></text><circle cx="207" cy="193" r="2" fill="#8b949e"/><text class="b" x="220" y="197">Minor in Business Administration</text><circle cx="207" cy="218" r="2" fill="#8b949e"/><text class="b" x="220" y="222">Bachelor thesis at Fraunhofer IPT: cloud-based architecture for domain-specific AutoML</text><text class="b" x="220" y="243">systems. Moved an AutoML pipeline onto Kubernetes (Oracle OKE) with a NestJS backend</text><text class="b" x="220" y="264">and ReactJS frontend</text></g><g class="a" style="animation-delay:360ms"><text class="h" x="204" y="316">IT Assistant<tspan class="d" font-weight="400" font-size="14"> Georg-Simon-Ohm-Berufskolleg</tspan></text><circle cx="207" cy="337" r="2" fill="#8b949e"/><text class="b" x="220" y="341">Application development and network administration</text></g></svg>